<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="02-DOM Form.css">
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2(1st)</h2>
    <p>Hello I am Retam Mondal</p>
    <p>I am a Full Stack Developer</p>
    <h2>Heading 2(1st)</h2>

     
    <form action="" id="form">
        <div>
            <label for="name">Name : </label>
            <input type="text" value="Retam" id="name" placeholder="Enter Your Name">
        </div>
        <!-- Value attribute give default value to input not like placeholder  -->
        <div>
            <label for="email">Email : </label>
            <input type="email" id="email" placeholder="Enter Your Email">
        </div>
        <div>
            <label for="passw">Password : </label>
            <input type="password" id="passw" placeholder="Enter Password">
        </div>
        <p id="password-hint" class="hidden">Must be at least 8 characters..</p>
        <div>
            <label for="bio">Bio : </label>
            <textarea name="bio" id="bio" placeholder="Enter bio..."></textarea>
            <p id="char-count">150 characters remaining..</p>
        </div>
        <div>
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and conditions</label>
        </div>
        <button type="submit" id="btn">Submit</button>
        <button type="submit2" id="btn2">Create Account</button>
    </form>




    <script src="03-basic.js"></script>
    <script src="04-sample form.js"></script>

</body>
</html>
