<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Practice</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Part 03: Selecting Elements -->
    <h1 id="h1">Hello</h1>
    <h1 id="h1">Cello</h1>
    <h1 id="h1">Mello</h1>
    
    <h2 class="heading">Subheading 1</h2>
    <input type="text" placeholder="Type something...">
    <div id="parent-div">
        <p>This is a child paragraph.</p>
    </div>

    <!-- Part 04: Reading and Modifying Content -->
    <p id="content-demo">Hello <b>World</b></p>
    <p id="hidden-demo">Hello <b style="display: none;">Hidden</b> World</p>

    <!-- Part 05: Attributes -->
    <p id="attr-demo">Testing Attributes</p>
    <button id="btn">Submit</button>

    <!-- Part 06 & 07: Classes and Styles -->
    <p id="class-style-demo">Practicing Classes and Styles</p>

    <!-- Part 08: Dataset -->
    <button id="buy-btn" data-product-id="42" data-price="19.99">Buy Now</button>

    <!-- Part 09, 10, 11: Creating, Removing, and Children -->
    <h1 id="h1-remove">I will be removed soon!</h1>
    
    <div id="product-list-one">
        <p>Original Product List</p>
    </div>

    <ul id="product-list">
        <li>Product A</li>
        <li>Product B</li>
        <li>Product C</li>
    </ul>

    <div id="parent">
        <p id="child">Child 1</p>
        <p>Child 2</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
